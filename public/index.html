<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>수상한 마법학교 — 마녀를 찾아라!</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%AE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net"><link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
  /* 제목 전용 글씨체(베이글팻원) — 프로젝트에 직접 포함되어 어디서나 표시됩니다 */
  @font-face{font-family:'Bagel';font-style:normal;font-weight:400;font-display:swap;
    src:url('fonts/bagel-fat-one-korean-400-normal.woff2') format('woff2'),url('fonts/bagel-fat-one-korean-400-normal.woff') format('woff');}
  :root{--bg:#080512;--panel:#141026;--panel2:#1d1840;--line:#2e2760;--txt:#eef1ff;--muted:#9c9ad6;
    --accent:#ff4d5e;--accent2:#b98bff;--good:#37d67a;--bad:#ff5a6e;--warn:#ffd23f;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    background:radial-gradient(1200px 700px at 50% -10%,#241a46 0%,#080512 60%);color:var(--txt);overflow:hidden;user-select:none}
  #app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:10px}
  .stars{position:fixed;inset:0;pointer-events:none;z-index:0}
  .card{background:linear-gradient(180deg,var(--panel),#100b22);border:1px solid var(--line);border-radius:20px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);position:relative;z-index:2}
  .title{font-family:'Bagel',sans-serif;font-size:clamp(34px,7.5vw,54px);font-weight:400;text-align:center;letter-spacing:0;margin:6px 0 2px;line-height:1.2;word-break:keep-all;
    color:#f0e6ff;
    text-shadow:2px 0 rgba(227,93,255,.6),-2px 0 rgba(55,214,208,.55),0 0 16px rgba(165,95,255,.8),0 3px 3px rgba(0,0,0,.4)}
  .title span{display:inline-block}
  .subtitle{text-align:center;color:var(--muted);margin:0 0 14px;font-size:14px}
  .btn{border:0;border-radius:13px;padding:13px 18px;font-weight:900;font-size:16px;cursor:pointer;color:#fff}
  .btn.primary{background:linear-gradient(180deg,#a06bff,#7a3de8);box-shadow:0 8px 22px rgba(122,61,232,.4);width:100%}
  .btn.primary:disabled{opacity:.45;cursor:not-allowed}
  .btn.good{background:linear-gradient(180deg,#37d67a,#1f9c56)}
  .btn.ghost{background:var(--panel2);border:1px solid var(--line)}
  .btn.warn{background:linear-gradient(180deg,#ff7a3d,#e8531f)}
  input.field{width:100%;background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;color:#fff;
    padding:13px 14px;font-size:16px;outline:none}
  input.field:focus{border-color:var(--accent2)}
  .small{font-size:12px;color:var(--muted)}
  .hidden{display:none!important}

  /* 연결/닉네임 */
  #scrConnect{width:min(440px,94vw);padding:26px}
  .beanrow{display:flex;gap:6px;justify-content:center;margin:6px 0 12px}

  /* 로비(방 목록) */
  #scrLobby{width:min(560px,96vw);max-height:94vh;overflow:auto;padding:22px}
  .rooms{display:flex;flex-direction:column;gap:10px;margin:12px 0}
  .roomrow{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .roomrow .nm{font-weight:800;font-size:16px}
  .roomrow .meta{margin-left:auto;text-align:right}
  .badge{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:20px}
  .badge.lobby{background:#1f5a38;color:#8affbe} .badge.playing{background:#5a2230;color:#ffb0bd} .badge.countdown{background:#5a5222;color:#ffe19a}
  .roomrow .btn{padding:9px 14px;font-size:14px}
  .createbox{display:flex;gap:8px;margin-top:8px}
  .createbox input{flex:1}

  /* 대기실 */
  #scrWait{width:min(560px,96vw);padding:22px;text-align:center}
  .plist{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0}
  .pcard{background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:10px 8px 8px;width:96px;position:relative}
  .pcard.ready{border-color:var(--good)}
  .pcard .rk{position:absolute;top:6px;right:8px;font-size:12px}
  .pcard .nm{font-size:13px;font-weight:800;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pcard svg{width:46px;height:auto}
  #bigCountdown{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(8,5,18,.7)}
  #bigCountdown .n{font-size:140px;font-weight:900;color:#fff;text-shadow:0 0 40px #a06bff}

  /* 게임 */
  #scrGame{display:none;width:min(1000px,98vw);padding:12px}
  .hud{display:flex;gap:8px;align-items:stretch;margin-bottom:10px;flex-wrap:wrap}
  .stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:7px 12px;flex:1;min-width:80px;text-align:center}
  .stat .k{font-size:11px;color:var(--muted);font-weight:700} .stat .v{font-size:19px;font-weight:900;margin-top:2px}
  .stat.time .v{color:#5aa8ff}.stat.task .v{color:var(--good)}.stat.jail .v{color:var(--accent)}
  .roleTag{padding:7px 12px;border-radius:12px;font-weight:900;font-size:14px;min-width:120px;text-align:center}
  .roleTag.crew{background:#1e3a5a;color:#9fd0ff} .roleTag.impostor{background:#5a1e2e;color:#ff9db0}
  #mapWrap{position:relative;width:100%;aspect-ratio:16/10;background:#070512;border:2px solid var(--line);border-radius:16px;overflow:hidden;touch-action:none;cursor:crosshair}
  #mapWorld{position:absolute;left:0;top:0;will-change:transform}
  .floor{position:absolute;border-radius:20px;border:3px solid #423a78;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 30px),
      repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 30px),
      linear-gradient(180deg,#1d1838,#151027);
    box-shadow:inset 0 0 60px rgba(0,0,0,.55),0 0 0 5px rgba(18,13,36,.7)}
  .floor.corr{border-radius:12px;border-color:#352d5e;border-width:2px;
    background:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,transparent 1px 26px),linear-gradient(180deg,#191430,#120f22)}
  .rglow{position:absolute;inset:0;border-radius:17px;pointer-events:none;z-index:0}
  .roomlabel{position:absolute;font-size:15px;color:#cdbcff;font-weight:800;transform:translate(-50%,-50%);white-space:nowrap;text-shadow:0 2px 8px #000,0 0 12px rgba(150,110,255,.5);z-index:2}
  .station{position:absolute;width:54px;height:54px;transform:translate(-50%,-50%);border-radius:50% 50% 46% 46%;
    background:radial-gradient(circle at 50% 32%,#4a3690,#241a48);border:2px solid #c9a3ff;display:flex;align-items:center;justify-content:center;
    font-size:25px;z-index:3;box-shadow:0 0 24px rgba(185,139,255,.6);animation:pulse 1.5s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(197,155,255,.6),0 0 22px rgba(185,139,255,.55)}70%{box-shadow:0 0 0 16px rgba(197,155,255,0),0 0 22px rgba(185,139,255,.55)}100%{box-shadow:0 0 0 0 rgba(197,155,255,0),0 0 22px rgba(185,139,255,.55)}}
  .jailfloor{position:absolute;border:3px solid #8a2544;border-radius:18px;overflow:hidden;z-index:2;
    background:radial-gradient(circle at 50% 50%,rgba(255,80,100,.14),transparent 62%),
      repeating-conic-gradient(from 0deg at 50% 50%,#2c1020 0deg 14deg,#210c1a 14deg 28deg);
    box-shadow:inset 0 0 50px rgba(255,60,90,.15),0 0 0 5px rgba(30,10,20,.7)}
  .jailfloor .jl{position:absolute;top:8px;left:12px;font-size:14px;color:#ffb0bd;font-weight:800;text-shadow:0 0 10px rgba(255,80,100,.6)}
  .deco{position:absolute;transform:translate(-50%,-50%);font-size:34px;opacity:.55;z-index:1;pointer-events:none;filter:drop-shadow(0 2px 6px #000)}
  .mcircle{position:absolute;transform:translate(-50%,-50%);pointer-events:none;z-index:0;opacity:.55;animation:spin 44s linear infinite}
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  .candle{position:absolute;transform:translate(-50%,-50%);width:12px;height:12px;border-radius:50%;z-index:1;pointer-events:none;
    background:radial-gradient(circle,#ffe6a8,#ff8a3d);box-shadow:0 0 16px 5px rgba(255,150,60,.55);animation:flick 2.4s ease-in-out infinite}
  @keyframes flick{0%,100%{opacity:.85}50%{opacity:1}}
  .char{position:absolute;transform:translate(-50%,-50%);width:52px;z-index:5;will-change:left,top}
  .char svg{display:block;width:100%;height:auto;filter:drop-shadow(0 5px 5px rgba(0,0,0,.5))}
  .char .name{position:absolute;left:50%;top:-15px;transform:translateX(-50%);font-size:11px;font-weight:800;background:#0b1020cc;padding:1px 7px;border-radius:8px;white-space:nowrap;color:#dbe3ff}
  .char.me .name{color:#fff;background:#7a3de8cc}
  .char.jailed{filter:grayscale(.7) brightness(.7)}
  .char.jailed::after{content:"";position:absolute;inset:-2px 8px;background:repeating-linear-gradient(90deg,transparent 0 7px,#c9d3ff88 7px 9px);border-radius:6px}
  #fog{position:absolute;inset:0;z-index:4;pointer-events:none}
  #minimap{position:absolute;right:10px;top:10px;z-index:7;border:1px solid #3a3470;border-radius:10px;background:#0a0718cc}
  .mmlabel{position:absolute;right:10px;top:8px;z-index:8;font-size:10px;color:#8f83c8;font-weight:700;pointer-events:none}
  .touchpad{position:absolute;left:14px;bottom:14px;width:120px;height:120px;z-index:10;opacity:.85;display:none}
  .touchpad .base{position:absolute;inset:0;border-radius:50%;background:#0b1020aa;border:2px solid var(--line)}
  .touchpad .nub{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#4a3a8f;border:2px solid #b98bff}
  .actbtns{position:absolute;right:14px;bottom:14px;z-index:10;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
  .abtn{border:0;border-radius:14px;padding:12px 16px;font-weight:900;font-size:15px;color:#fff;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.4)}
  .abtn.seal{background:linear-gradient(180deg,#ff4d6a,#c22440)} .abtn.seal:disabled{opacity:.4}
  .abtn.meet{background:linear-gradient(180deg,#ffab3d,#e8791f)} .abtn.meet:disabled{opacity:.4}
  .hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);color:#cfd7ff;font-size:12.5px;font-weight:600;background:#0b1020cc;padding:5px 14px;border-radius:10px;z-index:8;text-align:center;max-width:70%}
  .toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:9;background:#2a1540ee;border:1px solid #b98bff;color:#e6dcff;font-weight:800;font-size:13px;padding:7px 14px;border-radius:12px;opacity:0;transition:opacity .3s;pointer-events:none}

  /* 모달 */
  .overlay{position:fixed;inset:0;background:rgba(6,4,14,.72);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
  .modal{width:min(560px,96vw);max-height:94vh;overflow:auto}
  #quizCard{padding:22px}
  .qtag{display:inline-block;font-size:11px;font-weight:800;color:#0b1020;background:#b98bff;padding:3px 10px;border-radius:20px;margin-bottom:10px}
  .qtag.adv{background:var(--warn)}
  .qtext{font-size:19px;font-weight:800;line-height:1.45;margin:0 0 14px}
  .answers{display:flex;flex-direction:column;gap:10px}
  .answers button{text-align:left;background:var(--panel2);border:1.5px solid var(--line);color:var(--txt);padding:13px 15px;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer}
  .answers button:hover{border-color:#b98bff}
  .answers button.correct{background:#123c26;border-color:var(--good);color:#b7ffce}
  .answers button.wrong{background:#3c1420;border-color:var(--bad);color:#ffc2cb}
  .feedback{margin-top:12px;font-size:14px;line-height:1.6;padding:11px 13px;border-radius:12px;display:none}
  .feedback.ok{background:#0f3324;border:1px solid var(--good);color:#c8ffd9}
  .feedback.no{background:#331420;border:1px solid var(--bad);color:#ffc9d1}
  #quizClose{margin-top:12px;display:none}
  #meetCard{padding:22px;text-align:center}
  #endCard{padding:28px 24px;text-align:center;width:min(520px,96vw)}
  #endCard .big{font-size:clamp(28px,7vw,44px);font-weight:900;margin:6px 0}
  #endCard .big.win{color:var(--good)} #endCard .big.lose{color:var(--bad)}
  #endStats{font-size:14px;color:#c3ccf5;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;margin:14px 0}
  .mute{position:absolute;top:14px;right:16px;background:transparent;border:0;color:var(--muted);font-size:20px;cursor:pointer;z-index:9}
</style>
</head>
<body>
<canvas class="stars" id="stars"></canvas>
<div id="app">

  <!-- 연결/닉네임 -->
  <div class="card" id="scrConnect">
    <div class="beanrow" id="introBeans"></div>
    <h1 class="title">수상한 마법학교</h1>
    <p class="subtitle">🔮 마녀를 찾아라! · 실시간 멀티플레이 가정 복습 방탈출</p>
    <label class="small" style="font-weight:700">닉네임을 정하세요</label>
    <input class="field" id="nickInput" maxlength="12" placeholder="예: 마법사혜경" style="margin:6px 0 12px">
    <button class="btn primary" id="toLobbyBtn">방 목록으로 →</button>
    <p class="small" style="text-align:center;margin-top:12px" id="connStatus">서버 연결 중…</p>
  </div>

  <!-- 방 목록 -->
  <div class="card hidden" id="scrLobby">
    <h2 style="margin:0 0 2px">방 선택 <span class="small" id="myNick"></span></h2>
    <p class="small" style="margin:0 0 6px">먼저 도착한 순서대로 입장해요. 방은 최대 12명.</p>
    <div class="rooms" id="roomList"></div>
    <div class="createbox">
      <input class="field" id="newRoomName" maxlength="16" placeholder="새 방 이름 (예: 우리반 3조)">
      <button class="btn good" id="createRoomBtn" style="white-space:nowrap">방 만들기</button>
    </div>
  </div>

  <!-- 대기실 -->
  <div class="card hidden" id="scrWait">
    <h2 style="margin:0" id="waitRoomName">대기실</h2>
    <p class="small" id="waitInfo">모두 ‘준비 완료’를 누르면 자동으로 시작돼요.</p>
    <div class="plist" id="waitPlayers"></div>
    <button class="btn primary" id="readyBtn">준비 완료 ✔</button>
    <button class="btn ghost" id="leaveBtn" style="margin-top:8px">방 나가기</button>
  </div>

  <!-- 게임 -->
  <div class="card" id="scrGame">
    <div class="hud">
      <div class="stat time"><div class="k">⏱ 시간</div><div class="v" id="hudTime">--:--</div></div>
      <div class="stat task"><div class="k">📖 퀴즈</div><div class="v" id="hudTask">0/0</div></div>
      <div class="stat jail"><div class="k">🔮 봉인</div><div class="v" id="hudJail">0/0</div></div>
      <div class="roleTag crew" id="roleTag">역할</div>
    </div>
    <div id="mapWrap">
      <div id="mapWorld"></div>
      <div id="fog"></div>
      <canvas id="minimap" width="190" height="120"></canvas>
      <div class="mmlabel">MAP</div>
      <div class="touchpad" id="touchpad"><div class="base"></div><div class="nub" id="nub"></div></div>
      <div class="actbtns">
        <button class="abtn seal hidden" id="sealBtn">🔮 봉인</button>
        <button class="abtn meet" id="meetBtn">🚨 회의</button>
      </div>
      <div class="hint" id="hint">📖 마법서로 이동해 문제를 푸세요!</div>
      <div class="toast" id="toast"></div>
    </div>
  </div>
</div>

<!-- 퀴즈 -->
<div class="overlay" id="quizOverlay"><div class="card modal" id="quizCard">
  <span class="qtag" id="qtag">문제</span>
  <p class="qtext" id="qtext"></p>
  <div class="answers" id="answers"></div>
  <div class="feedback" id="feedback"></div>
  <button class="btn primary" id="quizClose">계속하기 ▶</button>
</div></div>

<!-- 긴급회의 -->
<div class="overlay" id="meetOverlay"><div class="card modal" id="meetCard">
  <h2 style="margin:2px 0">🚨 긴급 회의</h2>
  <p class="small" id="meetInfo">임포스터라고 생각하는 사람을 투표하세요.</p>
  <div style="font-weight:900;color:#ffd23f;margin:4px 0" id="meetTimer">남은 시간 --초</div>
  <div class="plist" id="voteList"></div>
  <button class="btn ghost" id="skipVote">기권 (넘기기)</button>
  <p class="small" id="voteCount" style="margin-top:8px"></p>
</div></div>

<!-- 종료 -->
<div class="overlay" id="endOverlay"><div class="card" id="endCard">
  <div class="big" id="endBig">결과</div>
  <div id="endReason" class="small" style="font-size:15px;margin:6px 0"></div>
  <div id="endStats"></div>
  <p class="small">잠시 후 대기실로 돌아갑니다…</p>
</div></div>

<!-- 카운트다운 -->
<div id="bigCountdown"><div class="n">3</div></div>

<!-- 강퇴 -->
<div class="overlay" id="kickOverlay"><div class="card" style="padding:26px;text-align:center;width:min(420px,94vw)">
  <div style="font-size:40px">🚪</div>
  <h2 id="kickMsg">관리자가 게임을 종료했습니다.</h2>
  <button class="btn primary" id="kickOk" style="margin-top:10px">방 목록으로</button>
</div></div>

<script>
/* ================= 공통 자원 ================= */
const $=s=>document.querySelector(s);
const COLORS=[{id:"red",name:"빨강",c:"#e0453f",d:"#8f2420"},{id:"blue",name:"파랑",c:"#3b6fe0",d:"#22417f"},{id:"green",name:"초록",c:"#3fbf62",d:"#217038"},{id:"yellow",name:"노랑",c:"#f2c53d",d:"#a07f18"},{id:"pink",name:"분홍",c:"#f07cc0",d:"#a03e78"},{id:"purple",name:"보라",c:"#8a5ce0",d:"#4e2f8f"},{id:"orange",name:"주황",c:"#f0873d",d:"#a0511a"},{id:"cyan",name:"청록",c:"#3fcfd0",d:"#1c7f80"},{id:"lime",name:"연두",c:"#a7e03f",d:"#5f8f1c"}];
function beanSVG(color,dark,w=52){return `<svg viewBox="0 0 100 132" width="${w}">
  <path d="M50 64 L84 122 Q50 134 16 122 Z" fill="${color}"/><path d="M50 64 L84 122 Q50 134 16 122 Z" fill="none" stroke="rgba(0,0,0,.22)" stroke-width="2"/><path d="M50 64 L50 128" stroke="rgba(0,0,0,.14)" stroke-width="2"/>
  <path d="M28 80 L13 106 L26 110 L37 88 Z" fill="${dark}"/><path d="M72 80 L87 106 L74 110 L63 88 Z" fill="${dark}"/><circle cx="50" cy="84" r="4" fill="#ffe14d"/>
  <circle cx="50" cy="50" r="22" fill="#ffdcbb"/><circle cx="42" cy="51" r="3.1" fill="#2a2a2a"/><circle cx="58" cy="51" r="3.1" fill="#2a2a2a"/><circle cx="43" cy="49.9" r=".9" fill="#fff"/><circle cx="59" cy="49.9" r=".9" fill="#fff"/>
  <circle cx="38" cy="57" r="2.8" fill="#ff9a9a" opacity=".4"/><circle cx="62" cy="57" r="2.8" fill="#ff9a9a" opacity=".4"/><path d="M44 59 Q50 63 56 59" stroke="#c56a4a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M50 3 Q57 26 76 42 Q50 34 24 42 Q43 26 50 3 Z" fill="${color}"/><path d="M50 3 Q57 26 76 42 Q50 34 24 42 Q43 26 50 3 Z" fill="none" stroke="rgba(0,0,0,.22)" stroke-width="2"/>
  <path d="M18 42 Q50 31 82 42 Q50 53 18 42 Z" fill="${dark}"/><path d="M49 15 L51.5 22 L58 24 L51.5 26 L49 33 L46.5 26 L40 24 L46.5 22 Z" fill="#ffe14d"/></svg>`;}

let ws, nick="";

function connect(){

/* ================= 메시지 처리 ================= */
function handle(m){
  switch(m.t){
    case 'rooms': renderRooms(m.rooms); break;
    case 'error': alert(m.msg); break;
    case 'joined':
      G={ roomId:m.roomId, roomName:m.name, meId:m.you, myColor:m.color, myReady:false, players:new Map() };
      $("#waitRoomName").textContent=m.name; $("#readyBtn").textContent="준비 완료 ✔"; $("#readyBtn").classList.remove("good");
      show("scrWait"); break;
    case 'lobby': if(G){G.roomName=m.name;$("#waitRoomName").textContent=m.name;} renderWait(m.players); break;
    case 'left': show("scrLobby"); break;
    case 'countdown': showCountdown(m.n); break;
    case 'countdownCancel': hideCountdown(); break;
    case 'start': startGame(m); break;
    case 'state': onState(m); break;
    case 'sealed': onSealed(m); break;
    case 'youSealed': G&&(G.jailedUntil=m.until, flash("🔮 봉인됐어요! 잠시 후 풀려나요…")); break;
    case 'youReleased': flash("✨ 봉인이 풀렸어요!"); break;
    case 'sealCd': if(G) G.sealReadyAt=m.until; break;
    case 'quizQ': openQuiz(m); break;
    case 'answerResult': quizResult(m); break;
    case 'progress': if(G){G.solved=m.solved;G.quizN=m.quizN;updateHUD();} break;
    case 'noQuiz': flash("남은 문제가 없어요!"); break;
    case 'meeting': openMeeting(m); break;
    case 'voteCount': $("#voteCount").textContent=`투표 ${m.count} / ${m.total}`; break;
    case 'meetingResult': meetingResult(m); break;
    case 'end': endGame(m); break;
    case 'reset': resetToWait(); break;
    case 'kicked': onKicked(m); break;
  }
}

let raf=null;
function startGame(m){
  hideCountdown();
  G.role=m.role; G.meId=m.youId; G.quizN=m.quizN; G.solved=0; G.timeLeft=m.time;
  G.sealCd=m.sealCd; G.sealRange=m.sealRange; G.sealReadyAt=0; G.jailedUntil=0;
  G.players=new Map();
  m.players.forEach(p=>{ G.players.set(p.id,{id:p.id,nick:p.nick,color:p.color,x:p.x,y:p.y,tx:p.x,ty:p.y,face:1,jailed:false,me:p.id===G.meId,el:null,svg:null}); });
  const me=G.players.get(G.meId); G.myX=me.x; G.myY=me.y; G.myFace=1;
  G.keys={}; G.joy=null; G.target=null; G.quizOpen=false; G.quizCooldown=false; G.meeting=false; G.running=true; G.lastSend=0;
  buildMap();
  $("#roleTag").className="roleTag "+(G.role==='impostor'?'impostor':'crew');
  $("#roleTag").textContent=G.role==='impostor'?'😈 나는 임포스터(마녀)':'🧙 나는 견습생';
  $("#sealBtn").classList.toggle("hidden", G.role!=='impostor');
  $("#touchpad").style.display=('ontouchstart' in window)?"block":"none";
  $("#hint").textContent=G.role==='impostor'?'😈 어둠 속에서 견습생에게 다가가 🔮봉인! (들키지 마세요)':'📖 마법서로 이동해 문제를 푸세요! (미니맵 참고)';
  show("scrGame");
  updateHUD();
  if(raf)cancelAnimationFrame(raf); G.lastT=performance.now(); raf=requestAnimationFrame(loop);
}
function buildMap(){
  const world=$("#mapWorld"); world.style.width=WORLD.w+"px"; world.style.height=WORLD.h+"px"; world.innerHTML="";
  CORR.forEach(c=>{const el=document.createElement("div");el.className="floor corr";el.style.cssText=`left:${c.x}px;top:${c.y}px;width:${c.w}px;height:${c.h}px`;world.appendChild(el);});
  ROOMS.forEach(r=>{const el=document.createElement("div");el.className="floor";el.style.cssText=`left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px`;world.appendChild(el);
    if(r.glow){const g=document.createElement("div");g.className="rglow";g.style.background=`radial-gradient(circle at 50% 45%, ${r.glow}33 0%, transparent 66%)`;el.appendChild(g);}
    if(r.circle){const mc=document.createElement("div");mc.className="mcircle";const sz=Math.min(r.w,r.h)*0.72;mc.innerHTML=magicCircle(sz,r.glow);mc.style.cssText=`left:${r.x+r.w/2}px;top:${r.y+r.h/2}px`;world.appendChild(mc);}
    [[r.x+26,r.y+26],[r.x+r.w-26,r.y+26],[r.x+26,r.y+r.h-26],[r.x+r.w-26,r.y+r.h-26]].forEach(([cx,cy])=>{const cd=document.createElement("div");cd.className="candle";cd.style.cssText=`left:${cx}px;top:${cy}px`;world.appendChild(cd);});
    const lb=document.createElement("div");lb.className="roomlabel";lb.textContent=r.label;lb.style.cssText=`left:${r.x+r.w/2}px;top:${r.y+26}px`;world.appendChild(lb);
    (r.deco||[]).forEach((ic,k)=>{const de=document.createElement("div");de.className="deco";de.textContent=ic;de.style.cssText=`left:${r.x+r.w*(k+1)/(r.deco.length+1)}px;top:${r.y+r.h-62}px`;world.appendChild(de);});});
  const jz=document.createElement("div");jz.className="jailfloor";jz.style.cssText=`left:${JAIL.x}px;top:${JAIL.y}px;width:${JAIL.w}px;height:${JAIL.h}px`;jz.innerHTML='<div class="jl">🔒 봉인의 방</div>';world.appendChild(jz);
  STATIONS.forEach(s=>{const el=document.createElement("div");el.className="station";el.style.cssText=`left:${s.x}px;top:${s.y}px`;el.textContent="📖";world.appendChild(el);});

function onState(m){
  if(!G||!G.running)return;
  G.timeLeft=m.timeLeft; G.solved=m.solved; G.quizN=m.quizN; updateHUD();
  m.players.forEach(sp=>{ const p=G.players.get(sp.id); if(!p)return;
    p.jailed=sp.jailed;
    if(sp.id!==G.meId){ p.tx=sp.x; p.ty=sp.y; p.face=sp.face; }
    else if(sp.jailed){ G.myX=sp.x; G.myY=sp.y; } // 봉인되면 서버 위치로
  });
  // 회의 타이머 표시
  if(m.meeting!=null && G.meeting){ $("#meetTimer").textContent="남은 시간 "+m.meeting+"초"; }
}
function onSealed(m){
  const p=G.players.get(m.targetId); if(p){ p.jailed=true; p.tx=m.x; p.ty=m.y; if(p.me){G.myX=m.x;G.myY=m.y;} }
  const near=p&&Math.hypot((p.tx)-G.myX,(p.ty)-G.myY)<G.visR;
  if(m.targetId===G.meId) {} else if(near&&p) spawnFx(p.tx,p.ty,(p.nick)+" 봉인!"); else flash("🔮 어디선가 견습생이 봉인됐어요…");
}
function spawnFx(x,y,txt){ const fx=document.createElement("div"); fx.textContent=txt;
  fx.style.cssText=`position:absolute;left:${x}px;top:${y}px;transform:translate(-50%,-50%);z-index:9;font-weight:900;color:#fff;background:#c22440;padding:3px 10px;border-radius:10px;pointer-events:none`;
  $("#mapWorld").appendChild(fx); setTimeout(()=>fx.remove(),1100); }

/* 루프 */
function loop(now){
  if(!G||!G.running){return;}
  const dt=Math.min(0.05,(now-G.lastT)/1000); G.lastT=now;
  if(!G.quizOpen && !G.meeting) moveMe(dt);
  interp();
  renderCam();
  drawMinimap();
  if(!G.quizOpen && !G.meeting) checkStations();
  // 봉인 버튼 쿨다운
  if(G.role==='impostor'){ const rem=Math.max(0,(G.sealReadyAt-Date.now())/1000);
    const b=$("#sealBtn"); b.disabled=rem>0||isJailed(); b.textContent=rem>0?`🔮 ${Math.ceil(rem)}s`:'🔮 봉인'; }
  $("#meetBtn").disabled=isJailed();
  raf=requestAnimationFrame(loop);
}
function isJailed(){ return Date.now()<(G.jailedUntil||0); }
function moveMe(dt){
  if(isJailed())return;
  let vx=0,vy=0,k=G.keys;
  if(k["a"]||k["arrowleft"])vx-=1; if(k["d"]||k["arrowright"])vx+=1;
  if(k["w"]||k["arrowup"])vy-=1; if(k["s"]||k["arrowdown"])vy+=1;
  if(G.joy){vx=G.joy.x;vy=G.joy.y;}
  else if(G.target){const dx=G.target.x-G.myX,dy=G.target.y-G.myY,d=Math.hypot(dx,dy); if(d<5)G.target=null; else{vx=dx/d;vy=dy/d;}}
  const mag=Math.hypot(vx,vy); if(mag>0){ if(mag>1){vx/=mag;vy/=mag;}
    const sp=3.4*dt*60, nx=G.myX+vx*sp, ny=G.myY+vy*sp;
    if(inWalk(nx,G.myY))G.myX=nx; if(inWalk(G.myX,ny))G.myY=ny;
    if(vx<0)G.myFace=-1; else if(vx>0)G.myFace=1;
  }
  // 서버 전송 ~15Hz
  if(performance.now()-G.lastSend>66){ G.lastSend=performance.now(); sendWS({t:'move',x:Math.round(G.myX),y:Math.round(G.myY),face:G.myFace});
    const me=G.players.get(G.meId); if(me){me.x=G.myX;me.y=G.myY;me.tx=G.myX;me.ty=G.myY;} }
}
function interp(){
  G.players.forEach(p=>{ if(p.me){p.x=G.myX;p.y=G.myY;} else { p.x+=(p.tx-p.x)*0.3; p.y+=(p.ty-p.y)*0.3; } });
}
function renderCam(){
  const wrap=$("#mapWrap"),vw=wrap.clientWidth,vh=wrap.clientHeight;
  G.visR=Math.max(210,Math.min(vw,vh)*0.46);
  const camx=G.myX-vw/2, camy=G.myY-vh/2;
  $("#mapWorld").style.transform=`translate(${-camx}px,${-camy}px)`;
  const R=G.visR;
  G.players.forEach(p=>{ if(!p.el)return; p.el.style.left=p.x+"px"; p.el.style.top=p.y+"px";
    const f=p.me?G.myFace:p.face; if(p.svg)p.svg.style.transform=`scaleX(${f})`;
    p.el.classList.toggle("jailed",p.jailed);
    const dist=Math.hypot(p.x-G.myX,p.y-G.myY);
    p.el.style.visibility=(p.me||dist<R)?"visible":"hidden"; });
  const cx=vw/2,cy=vh/2;
  $("#fog").style.background=`radial-gradient(circle ${R}px at ${cx}px ${cy}px, rgba(8,5,18,0) 0%, rgba(8,5,18,0) ${R-80}px, rgba(8,5,18,.9) ${R}px, rgba(8,5,18,.99) ${R+40}px)`;
}
function drawMinimap(){
  const cv=$("#minimap"),ctx=cv.getContext("2d");const sx=cv.width/WORLD.w,sy=cv.height/WORLD.h;
  ctx.clearRect(0,0,cv.width,cv.height);ctx.fillStyle="#0a0718";ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle="#26224c";CORR.forEach(r=>ctx.fillRect(r.x*sx,r.y*sy,r.w*sx,r.h*sy));
  ctx.fillStyle="#39316e";ROOMS.forEach(r=>ctx.fillRect(r.x*sx,r.y*sy,r.w*sx,r.h*sy));
  ctx.fillStyle="#5a2230";ctx.fillRect(JAIL.x*sx,JAIL.y*sy,JAIL.w*sx,JAIL.h*sy);
  STATIONS.forEach(s=>{ctx.fillStyle="#b98bff";ctx.beginPath();ctx.arc(s.x*sx,s.y*sy,2.4,0,7);ctx.fill();});
  ctx.fillStyle="#ff4d5e";ctx.beginPath();ctx.arc(G.myX*sx,G.myY*sy,3.4,0,7);ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=1;ctx.stroke();
}
function checkStations(){
  if(isJailed()||G.role==='impostor'){ // 임포스터도 위장으로 열 수 있게 허용하려면 이 조건 제거
    if(G.role==='impostor'){} }
  let near=false;
  STATIONS.forEach(s=>{ if(Math.hypot(s.x-G.myX,s.y-G.myY)<46)near=true; });
  if(!near){G.quizCooldown=false;}
  else if(!G.quizCooldown&&!G.quizOpen){ G.quizCooldown=true; sendWS({t:'reqQuiz'}); }
}
function updateHUD(){
  const m=Math.floor(G.timeLeft/60),s=Math.floor(G.timeLeft%60);
  $("#hudTime").textContent=(m<10?"0":"")+m+":"+(s<10?"0":"")+s;
  $("#hudTask").textContent=G.solved+"/"+G.quizN;
  const total=[...G.players.values()].filter(p=>true).length; // 표시용
  const jailedEver=0; // 정확한 everJailed는 서버 소관 — 봉인 수는 화면 정보로 대체
  $("#hudJail").textContent=[...G.players.values()].filter(p=>p.jailed).length+" 봉인중";
}
function flash(t){ $("#hint").textContent=t; clearTimeout(G._ht); G._ht=setTimeout(()=>{if(G)$("#hint").textContent=(G.role==='impostor'?'😈 견습생에게 다가가 🔮봉인!':'📖 마법서로 이동해 문제를 푸세요!');},1600); }
function toast(t){ const el=$("#toast"); el.textContent=t; el.style.opacity="1"; clearTimeout(G._tt); G._tt=setTimeout(()=>el.style.opacity="0",1900); }

/* 봉인/회의 버튼 */
$("#sealBtn").onclick=()=>{ sendWS({t:'seal'}); };
$("#meetBtn").onclick=()=>{ sendWS({t:'meeting'}); };

/* 퀴즈 */
function openQuiz(m){
  G.quizOpen=true; G.curQ=m;
  $("#quizOverlay").style.display="flex";
  const tag=$("#qtag");tag.textContent=m.part+(m.adv?" · 심화":"");tag.className="qtag"+(m.adv?" adv":"");
  $("#qtext").textContent="Q"+(m.solved+1)+". "+m.q;
  const box=$("#answers");box.innerHTML="";$("#feedback").style.display="none";$("#feedback").className="feedback";$("#quizClose").style.display="none";
  m.o.forEach(opt=>{const b=document.createElement("button");b.textContent=opt;b.onclick=()=>{ [...box.children].forEach(x=>x.disabled=true); G.pick=opt; sendWS({t:'answer',qid:m.qid,choice:opt}); };box.appendChild(b);});
}
function quizResult(m){
  const box=$("#answers"),fb=$("#feedback");
  [...box.children].forEach(b=>{ if(b.textContent===G.pick)b.classList.add(m.correct?"correct":"wrong");
    if(!m.correct&&(b.textContent===m.answer||b.textContent.indexOf(m.answer)===0))b.classList.add("correct"); });
  if(m.correct){fb.className="feedback ok";fb.innerHTML="⭕ 정답! <b>"+m.answer+"</b><br>"+m.ex;}
  else{fb.className="feedback no";fb.innerHTML="❌ 아쉬워요. 정답은 <b>"+m.answer+"</b><br>"+m.ex;}
  fb.style.display="block"; $("#quizClose").style.display="block";
}
$("#quizClose").onclick=()=>{ $("#quizOverlay").style.display="none"; G.quizOpen=false; G.curQ=null;
  // 다음 문제를 바로 못 열게 잠깐 대기(스테이션 벗어나야 재요청)
  G.quizCooldown=true; };

/* 회의/투표 */
function openMeeting(m){
  G.meeting=true; $("#quizOverlay").style.display="none"; G.quizOpen=false;
  $("#meetOverlay").style.display="flex"; $("#meetInfo").textContent=`${m.by}님이 회의를 소집했어요. (남은 지목 기회 ${m.chances})`;
  $("#voteCount").textContent=""; G.voted=false;
  const box=$("#voteList");box.innerHTML="";
  m.players.forEach(p=>{ if(p.id===G.meId)return; const el=document.createElement("div");el.className="pcard";
    el.innerHTML=`${beanSVG(p.color.c,p.color.d,46)}<div class="nm">${p.nick}</div>`;
    el.onclick=()=>castVote(p.id,el); box.appendChild(el); });
}
function castVote(target,el){ if(G.voted)return; G.voted=true; sendWS({t:'vote',target});
  [...$("#voteList").children].forEach(c=>c.style.opacity=".5"); if(el)el.style.outline="3px solid #ffd23f"; $("#skipVote").disabled=true; }
$("#skipVote").onclick=()=>{ if(G.voted)return; G.voted=true; sendWS({t:'vote',target:'skip'}); $("#skipVote").disabled=true; [...$("#voteList").children].forEach(c=>c.style.opacity=".5"); };
function meetingResult(m){
  $("#meetOverlay").style.display="none"; G.meeting=false; $("#skipVote").disabled=false;
  if(m.skip) toast("🤝 지목 없이 넘어갔어요.");
  else toast(`❌ ${m.ejected}은(는) 임포스터가 아니에요! 남은 기회 ${m.chances}`);
}

/* 종료/리셋 */
function endGame(m){
  G.running=false; if(raf)cancelAnimationFrame(raf);
  $("#quizOverlay").style.display="none"; $("#meetOverlay").style.display="none";
  const iWin = m.crewWin ? (G.role!=='impostor') : (G.role==='impostor');
  $("#endBig").textContent=iWin?"승리! 🎉":"패배… 😢";
  $("#endBig").className="big "+(iWin?"win":"lose");
  $("#endReason").textContent=m.reason;
  $("#endStats").innerHTML=`<div>맞힌 퀴즈: <b>${m.solved}/${m.quizN}</b></div><div>봉인된 견습생: <b>${m.jailed}/${m.targets}</b></div><div>임포스터(마녀): <b>${m.impostorNick}</b></div>`;
  $("#endOverlay").style.display="flex";
}
function resetToWait(){ $("#endOverlay").style.display="none"; G.myReady=false;
  $("#readyBtn").textContent="준비 완료 ✔"; $("#readyBtn").classList.remove("good"); show("scrWait"); }
function onKicked(m){ if(raf)cancelAnimationFrame(raf); G&&(G.running=false);
  $("#quizOverlay").style.display="none";$("#meetOverlay").style.display="none";$("#endOverlay").style.display="none";
  $("#kickMsg").textContent=m.reason||"관리자가 게임을 종료했습니다."; $("#kickOverlay").style.display="flex"; }

/* ================= 입력 ================= */
addEventListener("keydown",e=>{ if(!G||!G.running)return; const k=e.key.toLowerCase(); G.keys[k]=true;
  if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k))e.preventDefault();
  if(k==="e"&&G.role==='impostor'&&!G.quizOpen&&!G.meeting)sendWS({t:'seal'}); });
addEventListener("keyup",e=>{ if(!G)return; G.keys[e.key.toLowerCase()]=false; });
const mapWrap=$("#mapWrap");
mapWrap.addEventListener("click",e=>{ if(!G||!G.running||G.quizOpen||G.meeting)return;
  if(e.target.closest(".station")||e.target.closest(".touchpad")||e.target.closest("#minimap")||e.target.closest(".actbtns"))return;
  const r=mapWrap.getBoundingClientRect(); const cx=e.clientX-r.left,cy=e.clientY-r.top;
  const camx=G.myX-r.width/2,camy=G.myY-r.height/2; G.target={x:camx+cx,y:camy+cy}; G.joy=null; });
const pad=$("#touchpad"),nub=$("#nub");let padA=false,padC=null;
function ps(e){padA=true;const r=pad.getBoundingClientRect();padC={x:r.left+r.width/2,y:r.top+r.height/2};pm(e);e.preventDefault();}
function pm(e){if(!padA||!G)return;const t=e.touches?e.touches[0]:e;let dx=t.clientX-padC.x,dy=t.clientY-padC.y;const mag=Math.hypot(dx,dy),mx=45;if(mag>mx){dx=dx/mag*mx;dy=dy/mag*mx;}nub.style.left=(35+dx)+"px";nub.style.top=(35+dy)+"px";G.joy={x:dx/mx,y:dy/mx};G.target=null;e.preventDefault();}
function pe(){padA=false;if(G)G.joy=null;nub.style.left="35px";nub.style.top="35px";}
pad.addEventListener("touchstart",ps,{passive:false});pad.addEventListener("touchmove",pm,{passive:false});pad.addEventListener("touchend",pe);
pad.addEventListener("mousedown",ps);addEventListener("mousemove",e=>{if(padA)pm(e);});addEventListener("mouseup",pe);
</script>
</body>
</html>
